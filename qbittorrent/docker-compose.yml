services:
  wireguard2:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard2
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - ./wireguard-config:/config
      - /lib/modules:/lib/modules
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "8090:8080"        # qBittorrent WebUI
      - "6881:6881/tcp"    # torrent port
      - "6881:6881/udp"    # torrent port (DHT/peer traffic)
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:wireguard2"
    depends_on:
      - wireguard2
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${WEBUI_PORT}
      - TORRENTING_PORT=${TORRENTING_PORT}
    volumes:
      - ./config:/config
      - /home/nyarlathotep/downloads/torrents:/downloads
    restart: unless-stopped
