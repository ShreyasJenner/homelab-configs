services:
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    restart: unless-stopped
    ports:
      - "${HOST_PORT}:${DOCKER_PORT}"
    environment:
      - JWT_ENABLED=${JWT_ENABLED}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOW_PRIVATE_IP_ADDRESS=${PRIVATE_IP_PERMS}
      - USE_UNAUTHORIZED_STORAGE=${UNAUTH_STORAGE_PERM}
    volumes:
      - ${DATA_DIR_PATH}:/var/www/onlyoffice/Data
      - ${LOG_DIR_PATH}:/var/log/onlyoffice
