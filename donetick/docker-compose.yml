name: donetick
services:
  donetick:
    image: donetick/donetick
    container_name: donetick
    restart: unless-stopped
    ports:
      - "${HOST_PORT}:${DOCKER_PORT}"
    volumes:
      - ${DATA_DIR_PATH}:/donetick-data
      - ${CONFIG_DIR_PATH}:/config
    environment:
      DT_ENV: ${DT_ENV}
      DT_SQLITE_PATH: ${DT_SQLITE_PATH}
      TZ: ${TIMEZONE}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:${DOCKER_PATH}/api/v1/health || exit 1
      start_period: ${START_PERIOD}
      timeout: ${TIMEOUT}
      interval: ${INTERVAL}
      retries: ${RETRIES}
