name: donetick
services:
  donetick:
    image: donetick/donetick
    container_name: donetick
    restart: unless-stopped
    ports:
      - "2021:2021"
    volumes:
      - ./data:/donetick-data
      - ./config:/config
    environment:
      DT_ENV: ${DT_ENV}
      DT_SQLITE_PATH: ${DT_SQLITE_PATH}
      TZ: ${TIMEZONE}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:2021/api/v1/health || exit 1
      start_period: ${START_PERIOD}
      timeout: ${TIMEOUT}
      interval: ${INTERVAL}
      retries: ${RETRIES}
