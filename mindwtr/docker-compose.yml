name: mindwtr
services:
  mindwtr-cloud:
    image: ghcr.io/dongdongbh/mindwtr-cloud:latest
    container_name: mindwtr-cloud
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${CLOUD_DOCKER_PORT}/health >/dev/null || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "${CLOUD_HOST_PORT}:${CLOUD_DOCKER_PORT}"
    environment:
      - MINDWTR_CLOUD_AUTH_TOKENS=${AUTH_TOKEN:?MINDWTR_CLOUD_AUTH_TOKENS must be set}
      - MINDWTR_CLOUD_CORS_ORIGIN=${MINDWTR_CLOUD_CORS_ORIGIN:?MINDWTR_CLOUD_CORS_ORIGIN must be set}
    volumes:
      - ${CLOUD_DATA_DIR_PATH}:/app/cloud_data

  mindwtr-app:
    image: ghcr.io/dongdongbh/mindwtr-app:latest
    container_name: mindwtr-app
    restart: unless-stopped
    depends_on:
      mindwtr-cloud:
        condition: service_healthy
    ports:
      - "${APP_HOST_PORT}:${APP_DOCKER_PORT}"
