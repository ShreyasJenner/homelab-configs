services:
  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command:
      - serve
    env_file:
      - .env
    environment:
      - TZ=${TZ}      # optional: set desired timezone
    user: ${UID}:${GID} # optional: replace with your own user/group or uid/gid
    volumes:
      - ${CACHE_DIR}:/var/cache/ntfy
      - ${LIB_DIR}:/var/lib/ntfy
    ports:
      - "${HOST_PORT}:80"
    healthcheck: # optional: remember to adapt the host:port to your environment
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:${DOCKER_PORT}/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    restart: unless-stopped
    init: true # needed, if healthcheck is used. Prevents zombie processes

