name: slskd
services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=${WPUID}
      - PGID=${WPGID}
      - TZ=${WTZ}
    volumes:
      - ./wireguard-config:/config
      - /lib/modules:/lib/modules
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "${HTTP_HOST_PORT}:${HTTP_DOCKER_PORT}"    # slskd web UI (HTTP) — published here, not on slskd
      - "${HTTPS_HOST_PORT}:${HTTPS_DOCKER_PORT}"    # slskd web UI (HTTPS)
      - "${VPS_HOST_PORT}:${VPS_DOCKER_PORT}"  # not actually reachable from outside directly (CGNAT),
                        # but harmless to publish; real inbound path is via the VPS
    restart: unless-stopped

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    network_mode: "service:wireguard"
    depends_on:
      - wireguard
    environment:
      SLSKD_REMOTE_CONFIGURATION: ${SLSKD_REMOTE_CONFIG}
      SLSKD_USERNAME: ${SLSKD_USERNAME}
      SLSKD_PASSWORD: ${SLSKD_PASSWORD}
      SLSKD_WEB_USERNAME: ${SLSKD_WEB_USERNAME}
      SLSKD_WEB_PASSWORD: ${SLSKD_WEB_PASSWORD}
      SLSKD_SHARED_DIR: ${SLSKD_SHARED_DIR}
      PUID: ${PUID}
      GUID: ${GUID}
    volumes:
      - ${SLSKD_APP_DIR}:/app
      - ${SLSKD_MUSIC_DIR}:/app/shared/music:ro
    restart: unless-stopped
